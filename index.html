<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Política de seguridad de contenido (CSP): le dice al navegador qué se puede cargar
       y qué no. Es la red de seguridad por si algo se colara:
       - default-src 'self'      → por defecto, solo archivos de esta misma app.
       - script-src 'self'       → SOLO se ejecuta JS de aquí (vendor/chart.umd.min.js y src/**).
                                    Bloquea cualquier script externo o inyectado.
       - connect-src 'none'      → NADA puede enviar datos a internet (ni fetch, ni beacons).
                                    Aunque un script malicioso leyera tu localStorage,
                                    no tendría por dónde sacarlo del dispositivo.
       - object-src 'none' / base-uri 'self' / form-action 'none' → cierran otras vías. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">

  <title>Mis Finanzas</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Esto es lo que hace que Safari en iOS trate la web como una "app": icono propio,
       sin barra de direcciones al abrirla desde la pantalla de inicio, y color de fondo. -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="theme-color" content="#121212">
</head>
<body>

  <header class="app-header">
    <h1>Mis Finanzas</h1>
  </header>

  <main class="container" id="vista"></main>

  <!-- Navegación inferior de 5 pestañas. El contenido de cada una lo pinta src/main.js
       en #vista según qué botón esté activo. -->
  <nav class="bottom-nav" aria-label="Secciones de la app">
    <button class="nav-button active" data-vista="inicio" aria-current="page">
      <span class="nav-icon" aria-hidden="true">🏠</span><span>Inicio</span>
    </button>
    <button class="nav-button" data-vista="cuentas">
      <span class="nav-icon" aria-hidden="true">🏦</span><span>Cuentas</span>
    </button>
    <button class="nav-button" data-vista="movimientos">
      <span class="nav-icon" aria-hidden="true">📝</span><span>Movim.</span>
    </button>
    <button class="nav-button" data-vista="salario">
      <span class="nav-icon" aria-hidden="true">💼</span><span>Salario</span>
    </button>
    <button class="nav-button" data-vista="estadisticas">
      <span class="nav-icon" aria-hidden="true">📊</span><span>Stats</span>
    </button>
  </nav>

  <!-- Chart.js v4.4.6 guardado en local (no se carga de ningún servidor externo) -->
  <script src="vendor/chart.umd.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
